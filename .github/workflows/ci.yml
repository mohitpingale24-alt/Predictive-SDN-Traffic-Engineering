name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements-controller.txt -r requirements-ml.txt pytest
      - name: Run test suite
        run: python3 -m pytest tests/ -q
      - name: Byte-compile all sources
        run: python3 -m compileall -q . -x 'live-experiments|work'
