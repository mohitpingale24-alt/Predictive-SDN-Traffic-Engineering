name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The dashboard/analysis requirements are the reproducible set:
      # requirements-controller.txt pins ryu/eventlet, which only
      # install on the experiment VM's older Python (documented in
      # requirements-controller-verified.txt), and nothing in the test
      # suite imports them — controller modules are exercised through
      # AST-extracted methods with fake datapaths.
      - name: Install dependencies
        run: |
          pip install -r requirements-dashboard.txt pytest
      - name: Run test suite
        run: python3 -m pytest tests/ -q
      - name: Run dashboard JS tests
        run: node --test tests/test_dashboard_controls.cjs
      - name: Byte-compile all sources
        run: python3 -m compileall -q . -x 'live-experiments|work'
